<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ECE8F4">
  <title>Groceries · Kitchen Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../css/phone.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
  <main class="page">
    <div class="topbar">
      <div class="brand">KITCHEN HUB</div>
      <div class="segmented small" role="group" aria-label="Language">
        <button type="button" id="langEn" aria-pressed="true">EN</button>
        <button type="button" id="langBn" aria-pressed="false">বাংলা</button>
      </div>
    </div>

    <h1 id="title">Groceries</h1>

    <div class="segmented" role="group" aria-label="Store" id="stores"></div>

    <form class="row" id="addForm">
      <label for="newItem" class="sr" id="newItemLabel">What do we need?</label>
      <input id="newItem" type="text" autocomplete="off" enterkeyhint="done" placeholder="What do we need?">
      <button type="submit" class="btn primary icon" id="addBtn" aria-label="Add item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>

    <div>
      <div class="caption" id="quickLabel">Quick add</div>
      <div class="chips" id="quick" style="margin-top: 8px"></div>
    </div>

    <div class="card list" id="list"></div>
    <button type="button" class="btn soft" id="clearDone">Clear checked items</button>
    <div class="footer" id="footer">Shows on the kitchen TV</div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/groceries.js"></script>
</body>
</html>
