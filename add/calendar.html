<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ECE8F4">
  <title>Add to calendar · Kitchen Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../css/phone.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
  <main class="page">
    <div class="brand">KITCHEN HUB</div>
    <div>
      <h1>Add to calendar</h1>
      <div class="sub">ক্যালেন্ডারে যোগ করুন</div>
    </div>

    <form id="form" style="display: flex; flex-direction: column; gap: 18px">
      <div class="card dark">
        <label for="say" class="caption">Just type it</label>
        <input id="say" type="text" autocomplete="off" placeholder="Ammu dentist Tuesday 3pm">
        <button type="button" class="btn light" id="fill">Fill in for me</button>
      </div>

      <div class="card">
        <label for="title" class="caption">What</label>
        <input id="title" type="text" autocomplete="off" placeholder="Appointment or event" required>

        <div class="caption" id="whoLabel">Who</div>
        <div class="chips" role="group" aria-labelledby="whoLabel" id="who"></div>

        <div class="row">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
            <label for="date" class="caption">Date</label>
            <input id="date" type="date" required>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
            <label for="time" class="caption">Time</label>
            <input id="time" type="time" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn primary">Put it on the TV</button>
    </form>

    <div class="card success" id="success" hidden>
      <div class="tick"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div style="font-size: 24px; font-weight: 700">On the kitchen TV</div>
      <div class="sub" id="summary"></div>
      <button type="button" class="btn soft" id="again">Add another</button>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/calendar.js"></script>
</body>
</html>
